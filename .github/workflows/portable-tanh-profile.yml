name: Portable Tanh Profile

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C llvm-args=--fp-contract=fast"

jobs:
  windows:
    name: Windows x86-64 A1 callback
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Measure scalar fast-kernel callback
        env:
          NAM_DISABLE_PORTABLE_VECTOR_TANH: "1"
        run: |
          cargo bench -p nam-plugin --features benchmark-internals,nam-core/fast-kernels --bench callback -- a1_accurate_complete_plugin_callback
          New-Item -ItemType Directory -Force -Path profiles/scalar | Out-Null
          Copy-Item target/criterion/a1_accurate_complete_plugin_callback profiles/scalar -Recurse

      - name: Measure portable vector callback
        run: |
          cargo bench -p nam-plugin --features benchmark-internals,nam-core/fast-kernels --bench callback -- a1_accurate_complete_plugin_callback
          New-Item -ItemType Directory -Force -Path profiles/vector | Out-Null
          Copy-Item target/criterion/a1_accurate_complete_plugin_callback profiles/vector -Recurse

      - name: Verify render parity and allocation behavior
        run: |
          cargo test --release -p nam-core --lib get_dsp::tests::test_regression_wavenet_a1_standard --features fast-kernels
          cargo test --release -p nam-plugin --lib complete_callback_with_a1_wavenet_does_not_allocate --features nam-core/fast-kernels

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-tanh-windows-baseline
          path: profiles

  musl:
    name: Alpine musl x86-64 A1 callback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Measure accurate A1 callback
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            --env CARGO_TERM_COLOR \
            --env RUSTFLAGS \
            rust:1.97-alpine \
            sh -c '
              apk add --no-cache \
                build-base clang cmake git pkgconf valgrind-dev \
                libx11-dev libxcb-dev mesa-dev libxcursor-dev \
                libxrandr-dev libxi-dev libxinerama-dev \
                wayland-dev libxkbcommon-dev &&
              export RUSTFLAGS="$RUSTFLAGS -C target-feature=-crt-static" &&
              NAM_DISABLE_PORTABLE_VECTOR_TANH=1 \
                cargo bench -p nam-plugin \
                  --features benchmark-internals,nam-core/fast-kernels \
                  --bench callback -- a1_accurate_complete_plugin_callback &&
              mkdir -p profiles/scalar profiles/vector &&
              cp -R target/criterion/a1_accurate_complete_plugin_callback \
                profiles/scalar/ &&
              cargo bench -p nam-plugin \
                --features benchmark-internals,nam-core/fast-kernels \
                --bench callback -- a1_accurate_complete_plugin_callback &&
              cp -R target/criterion/a1_accurate_complete_plugin_callback \
                profiles/vector/ &&
              cargo test --release -p nam-core --lib \
                get_dsp::tests::test_regression_wavenet_a1_standard \
                --features fast-kernels &&
              cargo test --release -p nam-plugin --lib \
                complete_callback_with_a1_wavenet_does_not_allocate \
                --features nam-core/fast-kernels
            '

      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-tanh-musl-baseline
          path: profiles
