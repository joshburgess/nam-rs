name: Plugin Release Validation

on:
  workflow_call:
    inputs:
      attest:
        description: Generate provenance for release archives
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C llvm-args=--fp-contract=fast"
  NAM_BUILD_GIT_COMMIT: ${{ github.sha }}
  NAM_RELEASE_VERSION: "0.2.0"

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
            validator_platform: macos
            target: aarch64-apple-darwin
            trainer_bin: nam-trainer
            pluginval_bin: validator-tools/pluginval/pluginval.app/Contents/MacOS/pluginval
            clap_validator_bin: validator-tools/clap-validator/clap-validator
          # Pluginval 1.0.4 predates the Windows Server 2025 runner image.
          - os: windows-2022
            platform: windows-x86_64
            validator_platform: windows
            target: x86_64-pc-windows-msvc
            trainer_bin: nam-trainer.exe
            pluginval_bin: validator-tools/pluginval/pluginval.exe
            clap_validator_bin: validator-tools/clap-validator/clap-validator.exe
          # Ubuntu 22.04 keeps release binaries compatible with glibc 2.35.
          - os: ubuntu-22.04
            platform: linux-x86_64
            validator_platform: linux
            target: x86_64-unknown-linux-gnu
            trainer_bin: nam-trainer
            pluginval_bin: validator-tools/pluginval/pluginval
            clap_validator_bin: validator-tools/clap-validator/clap-validator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libx11-xcb-dev libgl-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev xvfb

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-release-validation-v1-${{ hashFiles('**/Cargo.lock') }}

      - name: Verify plugin feature defaults
        run: python scripts/check_plugin_features.py

      - name: Verify release version
        run: python scripts/check_release_version.py --expected ${{ env.NAM_RELEASE_VERSION }}

      - name: Enable Windows crash symbols
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"RUSTFLAGS=$env:RUSTFLAGS -C debuginfo=1" >> $env:GITHUB_ENV'

      - name: Run release plugin regressions
        run: cargo test --release -p nam-core -p nam-plugin

      - name: Bundle portable plugin fallback
        run: cargo xtask bundle nam-plugin --release --no-default-features

      - name: Preserve portable bundles (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p validation/portable
          cp -R target/bundled/. validation/portable/

      - name: Preserve portable bundles (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path validation/portable | Out-Null
          Copy-Item -Recurse target/bundled/* validation/portable/
          Get-ChildItem target/release -Filter *.pdb |
            Copy-Item -Destination validation/portable/

      - name: Inspect portable plugin binaries
        run: >-
          python scripts/check_release_artifacts.py validation/portable
          --version ${{ env.NAM_RELEASE_VERSION }}
          --commit ${{ github.sha }}
          --target ${{ matrix.target }}
          --features portable

      - name: Bundle optimized plugin
        run: cargo xtask bundle nam-plugin --release

      - name: Preserve optimized bundles (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p validation/release
          cp -R target/bundled/. validation/release/

      - name: Preserve optimized bundles (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path validation/release | Out-Null
          Copy-Item -Recurse target/bundled/* validation/release/
          Get-ChildItem target/release -Filter *.pdb |
            Copy-Item -Destination validation/release/

      - name: Inspect optimized plugin binaries
        run: >-
          python scripts/check_release_artifacts.py validation/release
          --version ${{ env.NAM_RELEASE_VERSION }}
          --commit ${{ github.sha }}
          --target ${{ matrix.target }}
          --features fast-kernels

      - name: Install pinned plugin validators
        run: >-
          python scripts/install_plugin_validators.py
          --platform ${{ matrix.validator_platform }}
          --destination validator-tools

      - name: Prepare validation diagnostics (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: mkdir -p validator-logs/{portable,release}/pluginval-results crash-dumps

      - name: Prepare validation diagnostics (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path validator-logs/portable/pluginval-results | Out-Null
          New-Item -ItemType Directory -Force -Path validator-logs/release/pluginval-results | Out-Null
          New-Item -ItemType Directory -Force -Path crash-dumps | Out-Null
          $dumps = 'HKCU:\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps'
          New-Item -Path $dumps -Force | Out-Null
          New-ItemProperty -Path $dumps -Name DumpFolder -Value "$PWD\crash-dumps" -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $dumps -Name DumpType -Value 2 -PropertyType DWord -Force | Out-Null

      - name: Enable Linux core dumps
        if: runner.os == 'Linux'
        shell: bash
        run: sudo sysctl -w kernel.core_pattern="$PWD/crash-dumps/core.%e.%p"

      - name: Validate portable VST3 with pluginval (Linux)
        id: pluginval_portable_linux
        if: runner.os == 'Linux'
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        run: |
          ulimit -c unlimited
          python scripts/run_with_timeout.py \
            --timeout-seconds 900 \
            --log validator-logs/portable/pluginval.log \
            -- xvfb-run -a "${{ matrix.pluginval_bin }}" \
            --strictness-level 10 \
            --timeout-ms 120000 \
            --skip-gui-tests \
            --sample-rates 44100,48000,96000 \
            --block-sizes 1,17,64,127,512,1024 \
            --random-seed 0x4e414d \
            --output-dir validator-logs/portable/pluginval-results \
            validation/portable/nam-plugin.vst3

      - name: Validate portable VST3 with pluginval
        id: pluginval_portable_other
        if: runner.os != 'Linux'
        continue-on-error: true
        timeout-minutes: 20
        run: >-
          python scripts/run_with_timeout.py
          --timeout-seconds 900
          --log validator-logs/portable/pluginval.log
          -- "${{ matrix.pluginval_bin }}"
          --strictness-level 10
          --timeout-ms 120000
          --skip-gui-tests
          --sample-rates 44100,48000,96000
          --block-sizes 1,17,64,127,512,1024
          --random-seed 0x4e414d
          --output-dir validator-logs/portable/pluginval-results
          validation/portable/nam-plugin.vst3

      - name: Validate optimized VST3 with pluginval (Linux)
        id: pluginval_release_linux
        if: runner.os == 'Linux'
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        run: |
          ulimit -c unlimited
          python scripts/run_with_timeout.py \
            --timeout-seconds 900 \
            --log validator-logs/release/pluginval.log \
            -- xvfb-run -a "${{ matrix.pluginval_bin }}" \
            --strictness-level 10 \
            --timeout-ms 120000 \
            --skip-gui-tests \
            --sample-rates 44100,48000,96000 \
            --block-sizes 1,17,64,127,512,1024 \
            --random-seed 0x4e414d \
            --output-dir validator-logs/release/pluginval-results \
            validation/release/nam-plugin.vst3

      - name: Validate optimized VST3 with pluginval
        id: pluginval_release_other
        if: runner.os != 'Linux'
        continue-on-error: true
        timeout-minutes: 20
        run: >-
          python scripts/run_with_timeout.py
          --timeout-seconds 900
          --log validator-logs/release/pluginval.log
          -- "${{ matrix.pluginval_bin }}"
          --strictness-level 10
          --timeout-ms 120000
          --skip-gui-tests
          --sample-rates 44100,48000,96000
          --block-sizes 1,17,64,127,512,1024
          --random-seed 0x4e414d
          --output-dir validator-logs/release/pluginval-results
          validation/release/nam-plugin.vst3

      - name: Validate portable CLAP bundle
        id: clap_portable
        continue-on-error: true
        timeout-minutes: 20
        run: >-
          python scripts/run_with_timeout.py
          --timeout-seconds 900
          --log validator-logs/portable/clap-validator.log
          -- "${{ matrix.clap_validator_bin }}"
          validate --jobs 1
          validation/portable/nam-plugin.clap

      - name: Validate optimized CLAP bundle
        id: clap_release
        continue-on-error: true
        timeout-minutes: 20
        run: >-
          python scripts/run_with_timeout.py
          --timeout-seconds 900
          --log validator-logs/release/clap-validator.log
          -- "${{ matrix.clap_validator_bin }}"
          validate --jobs 1
          validation/release/nam-plugin.clap

      - name: Install Windows debugger after VST3 crash
        if: >-
          runner.os == 'Windows' &&
          (steps.pluginval_portable_other.outcome == 'failure' ||
          steps.pluginval_release_other.outcome == 'failure')
        shell: pwsh
        run: >-
          choco install windows-sdk-10-version-2004-windbg
          --version 10.0.19041.685 --yes --no-progress

      - name: Capture Windows VST3 crash stacks
        if: >-
          runner.os == 'Windows' &&
          (steps.pluginval_portable_other.outcome == 'failure' ||
          steps.pluginval_release_other.outcome == 'failure')
        timeout-minutes: 10
        shell: pwsh
        run: |
          $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
          if (-not (Test-Path $cdb)) {
            throw "cdb.exe was not installed at $cdb"
          }

          $pluginval = (Resolve-Path '${{ matrix.pluginval_bin }}').Path
          $common = @(
            '--strictness-level', '10',
            '--timeout-ms', '120000',
            '--skip-gui-tests',
            '--sample-rates', '44100,48000,96000',
            '--block-sizes', '1,17,64,127,512,1024',
            '--random-seed', '0x4e414d'
          )

          foreach ($variant in 'portable', 'release') {
            $bundle = (Resolve-Path "validation/$variant/nam-plugin.vst3").Path
            $symbols = (Resolve-Path "validation/$variant").Path
            $commands = @"
          .symfix
          .sympath+ $symbols
          sxe -c ".ecxr; .reload /f; kv; lm; q" av
          g
          "@
            $commandFile = "validator-logs/$variant/cdb-commands.txt"
            Set-Content -Path $commandFile -Value $commands
            python scripts/run_with_timeout.py `
              --timeout-seconds 180 `
              --log "validator-logs/$variant/cdb.log" `
              -- $cdb -o -cf $commandFile $pluginval @common $bundle
          }

      - name: Collect Windows crash events
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $events = @(Get-WinEvent -FilterHashtable @{
            LogName = 'Application'
            StartTime = (Get-Date).AddHours(-2)
          } -ErrorAction SilentlyContinue)
          $events |
            Where-Object ProviderName -In 'Application Error', 'Windows Error Reporting' |
            Format-List TimeCreated, ProviderName, Id, LevelDisplayName, Message |
            Out-File validator-logs/windows-crashes.txt

      - name: Upload validator diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-validation-${{ matrix.platform }}
          if-no-files-found: ignore
          path: |
            validator-logs/
            crash-dumps/
            validation/**/*.pdb
            ~/Library/Logs/DiagnosticReports/pluginval*
            ~/Library/Logs/DiagnosticReports/clap-validator*

      - name: Enforce validator success
        if: >-
          always() &&
          (steps.pluginval_portable_linux.outcome == 'failure' ||
          steps.pluginval_portable_other.outcome == 'failure' ||
          steps.pluginval_release_linux.outcome == 'failure' ||
          steps.pluginval_release_other.outcome == 'failure' ||
          steps.clap_portable.outcome == 'failure' ||
          steps.clap_release.outcome == 'failure')
        run: exit 1

      - name: Measure portable A1 callback
        run: >-
          cargo bench -p nam-plugin --no-default-features
          --features benchmark-internals --bench callback
          -- a1_accurate_complete_plugin_callback

      - name: Preserve portable measurements (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p profiles/portable
          mv target/criterion/a1_accurate_complete_plugin_callback profiles/portable/

      - name: Preserve portable measurements (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path profiles/portable | Out-Null
          Move-Item target/criterion/a1_accurate_complete_plugin_callback profiles/portable/

      - name: Measure optimized A1 callback
        run: >-
          cargo bench -p nam-plugin --features benchmark-internals
          --bench callback -- a1_accurate_complete_plugin_callback

      - name: Preserve optimized measurements (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p profiles/release
          mv target/criterion/a1_accurate_complete_plugin_callback profiles/release/

      - name: Preserve optimized measurements (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path profiles/release | Out-Null
          Move-Item target/criterion/a1_accurate_complete_plugin_callback profiles/release/

      - name: Enforce optimized callback speedup
        run: >-
          python scripts/check_callback_speedup.py
          profiles/portable profiles/release

      - name: Upload release measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-callback-${{ matrix.platform }}
          path: profiles/

      - name: Build trainer
        run: cargo build --release -p nam-trainer

      - name: Smoke test trainer (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run -a bash -c "
            ./target/release/${{ matrix.trainer_bin }} &
            pid=\$!
            sleep 5
            if kill -0 \$pid 2>/dev/null; then
              kill \$pid
              echo 'Trainer stayed alive for 5s'
              exit 0
            fi
            echo 'Trainer died before 5s'
            wait \$pid
            exit 1
          "

      - name: Package validated release
        run: >-
          python scripts/package_release.py
          --plugin-root validation/release
          --trainer target/release/${{ matrix.trainer_bin }}
          --output-dir release-staging
          --version ${{ env.NAM_RELEASE_VERSION }}
          --commit ${{ github.sha }}
          --platform ${{ matrix.platform }}
          --target ${{ matrix.target }}
          --features fast-kernels

      - name: Build previous-version installation fixture
        run: >-
          python scripts/package_release.py
          --plugin-root validation/release
          --trainer target/release/${{ matrix.trainer_bin }}
          --output-dir upgrade-fixture
          --version 0.1.0
          --commit 0000000000000000000000000000000000000000
          --platform ${{ matrix.platform }}
          --target ${{ matrix.target }}
          --features fast-kernels

      - name: Exercise install, collision rejection, and upgrade
        id: installed
        run: >-
          python scripts/exercise_release_install.py
          --previous upgrade-fixture/nam-rs-v0.1.0-${{ matrix.platform }}.zip
          --current release-staging/nam-rs-v${{ env.NAM_RELEASE_VERSION }}-${{ matrix.platform }}.zip

      - name: Uninstall release
        if: always() && steps.installed.outcome == 'success'
        run: >-
          python scripts/install_release.py uninstall
          --platform ${{ matrix.platform }}

      - name: Attest release archive provenance
        if: inputs.attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: release-staging/nam-rs-v${{ env.NAM_RELEASE_VERSION }}-${{ matrix.platform }}.zip

      - name: Upload validated release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package-${{ matrix.platform }}
          path: release-staging/

  install-downloaded:
    name: Install Downloaded Release (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
            validator_platform: macos
            target: aarch64-apple-darwin
            pluginval_bin: validator-tools/pluginval/pluginval.app/Contents/MacOS/pluginval
            clap_validator_bin: validator-tools/clap-validator/clap-validator
          - os: windows-2022
            platform: windows-x86_64
            validator_platform: windows
            target: x86_64-pc-windows-msvc
            pluginval_bin: validator-tools/pluginval/pluginval.exe
            clap_validator_bin: validator-tools/clap-validator/clap-validator.exe
          - os: ubuntu-22.04
            platform: linux-x86_64
            validator_platform: linux
            target: x86_64-unknown-linux-gnu
            pluginval_bin: validator-tools/pluginval/pluginval
            clap_validator_bin: validator-tools/clap-validator/clap-validator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libx11-xcb-dev libgl-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev xvfb

      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package-${{ matrix.platform }}
          path: release-download

      - name: Install pinned plugin validators
        run: >-
          python scripts/install_plugin_validators.py
          --platform ${{ matrix.validator_platform }}
          --destination validator-tools

      - name: Install downloaded release into system paths
        id: installed
        run: >-
          python scripts/install_release.py install
          release-download/nam-rs-v${{ env.NAM_RELEASE_VERSION }}-${{ matrix.platform }}.zip
          --github-output

      - name: Prepare validation logs
        shell: bash
        run: mkdir -p installed-validation/pluginval-results

      - name: Validate installed VST3 (Linux)
        id: installed_vst3_linux
        if: runner.os == 'Linux'
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        run: >-
          python scripts/run_with_timeout.py
          --timeout-seconds 900
          --log installed-validation/pluginval.log
          -- xvfb-run -a "${{ matrix.pluginval_bin }}"
          --strictness-level 10
          --timeout-ms 120000
          --skip-gui-tests
          --sample-rates 44100,48000,96000
          --block-sizes 1,17,64,127,512,1024
          --random-seed 0x4e414d
          --output-dir installed-validation/pluginval-results
          "${{ steps.installed.outputs.vst3 }}"

      - name: Validate installed VST3
        id: installed_vst3_other
        if: runner.os != 'Linux'
        continue-on-error: true
        timeout-minutes: 20
        run: >-
          python scripts/run_with_timeout.py
          --timeout-seconds 900
          --log installed-validation/pluginval.log
          -- "${{ matrix.pluginval_bin }}"
          --strictness-level 10
          --timeout-ms 120000
          --skip-gui-tests
          --sample-rates 44100,48000,96000
          --block-sizes 1,17,64,127,512,1024
          --random-seed 0x4e414d
          --output-dir installed-validation/pluginval-results
          "${{ steps.installed.outputs.vst3 }}"

      - name: Validate installed CLAP
        id: installed_clap
        continue-on-error: true
        timeout-minutes: 20
        run: >-
          python scripts/run_with_timeout.py
          --timeout-seconds 900
          --log installed-validation/clap-validator.log
          -- "${{ matrix.clap_validator_bin }}"
          validate --jobs 1
          "${{ steps.installed.outputs.clap }}"

      - name: Smoke test installed trainer (Linux)
        id: installed_trainer_linux
        if: runner.os == 'Linux'
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: >-
          python scripts/run_with_timeout.py
          --timeout-seconds 5
          --success-on-timeout
          --log installed-validation/trainer.log
          -- xvfb-run -a "${{ steps.installed.outputs.trainer }}"
          --smoke-test-report installed-validation/trainer-smoke.json

      - name: Smoke test installed trainer
        id: installed_trainer_other
        if: runner.os == 'macOS'
        continue-on-error: true
        timeout-minutes: 5
        run: >-
          python scripts/run_with_timeout.py
          --timeout-seconds 5
          --success-on-timeout
          --log installed-validation/trainer.log
          -- "${{ steps.installed.outputs.trainer }}"
          --smoke-test-report installed-validation/trainer-smoke.json

      - name: Headless smoke test installed trainer (Windows)
        id: installed_trainer_windows
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 5
        run: >-
          python scripts/run_with_timeout.py
          --timeout-seconds 5
          --log installed-validation/trainer.log
          -- "${{ steps.installed.outputs.trainer }}"
          --headless-smoke-test
          --smoke-test-report installed-validation/trainer-smoke.json

      - name: Verify installed trainer metadata
        id: installed_trainer_metadata
        if: >-
          always() &&
          (steps.installed_trainer_linux.outcome == 'success' ||
          steps.installed_trainer_other.outcome == 'success' ||
          steps.installed_trainer_windows.outcome == 'success')
        continue-on-error: true
        run: >-
          python scripts/check_trainer_smoke_report.py
          installed-validation/trainer-smoke.json
          --version ${{ env.NAM_RELEASE_VERSION }}
          --commit ${{ github.sha }}
          --target ${{ matrix.target }}

      - name: Upload installed release diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-release-${{ matrix.platform }}
          if-no-files-found: ignore
          path: installed-validation/

      - name: Uninstall release
        if: always() && steps.installed.outcome == 'success'
        run: >-
          python scripts/install_release.py uninstall
          --platform ${{ matrix.platform }}

      - name: Enforce installed release validation
        if: >-
          always() &&
          (steps.installed_vst3_linux.outcome == 'failure' ||
          steps.installed_vst3_other.outcome == 'failure' ||
          steps.installed_clap.outcome == 'failure' ||
          steps.installed_trainer_linux.outcome == 'failure' ||
          steps.installed_trainer_other.outcome == 'failure' ||
          steps.installed_trainer_windows.outcome == 'failure' ||
          steps.installed_trainer_metadata.outcome == 'failure')
        run: exit 1
