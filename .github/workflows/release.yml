name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  # Override .cargo/config.toml's target-cpu=native so release binaries run on
  # any x86_64 CPU, not just the GitHub runner's. Use RUSTFLAGS (higher Cargo
  # precedence) rather than CARGO_BUILD_RUSTFLAGS so build.rustflags is fully
  # replaced, not merged.
  RUSTFLAGS: "-C llvm-args=--fp-contract=fast"

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
            trainer_bin: nam-trainer
          - os: windows-latest
            platform: windows-x86_64
            trainer_bin: nam-trainer.exe
          # Pin to 22.04 (glibc 2.35) instead of ubuntu-latest (24.04, glibc
          # 2.39) so the binary runs on Debian bookworm, RHEL 9, and older
          # LTS Ubuntus without hitting GLIBC_2.38-not-found errors.
          - os: ubuntu-22.04
            platform: linux-x86_64
            trainer_bin: nam-trainer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libx11-xcb-dev libgl-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev xvfb

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Verify plugin feature defaults
        run: python scripts/check_plugin_features.py

      - name: Run release plugin regressions
        run: cargo test --release -p nam-core -p nam-plugin

      - name: Bundle portable plugin fallback
        run: cargo xtask bundle nam-plugin --release --no-default-features

      - name: Bundle plugin
        run: cargo xtask bundle nam-plugin --release

      - name: Inspect plugin binaries
        run: python scripts/check_release_artifacts.py target/bundled

      - name: Measure portable A1 callback
        run: >-
          cargo bench -p nam-plugin --no-default-features
          --features benchmark-internals --bench callback
          -- a1_accurate_complete_plugin_callback

      - name: Preserve portable measurements (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p profiles/portable
          mv target/criterion/a1_accurate_complete_plugin_callback profiles/portable/

      - name: Preserve portable measurements (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path profiles/portable | Out-Null
          Move-Item target/criterion/a1_accurate_complete_plugin_callback profiles/portable/

      - name: Measure release A1 callback
        run: >-
          cargo bench -p nam-plugin --features benchmark-internals
          --bench callback -- a1_accurate_complete_plugin_callback

      - name: Preserve release measurements (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p profiles/release
          mv target/criterion/a1_accurate_complete_plugin_callback profiles/release/

      - name: Preserve release measurements (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path profiles/release | Out-Null
          Move-Item target/criterion/a1_accurate_complete_plugin_callback profiles/release/

      - name: Enforce release callback speedup
        run: >-
          python scripts/check_callback_speedup.py
          profiles/portable profiles/release

      - name: Build trainer
        run: cargo build --release -p nam-trainer

      # Smoke test: launch the trainer binary, wait 5 seconds, and verify it's
      # still alive. Catches crashes on startup (SIGILL from bad codegen,
      # missing dynamic libraries, panic during eframe::run_native, config
      # path crashes, etc). macOS and Windows are skipped because the
      # GitHub-hosted runners lack a proper desktop session (no WindowServer
      # on macOS, no GPU/OpenGL context on Windows Server), so eframe's
      # wgpu/glow backend fails to initialize. Linux works via xvfb.
      - name: Smoke test trainer (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run -a bash -c "
            ./target/release/${{ matrix.trainer_bin }} &
            pid=\$!
            sleep 5
            if kill -0 \$pid 2>/dev/null; then
              kill \$pid
              echo 'Trainer stayed alive for 5s'
              exit 0
            fi
            echo 'Trainer died before 5s'
            wait \$pid
            exit 1
          "

      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p release-staging
          cp "target/release/${{ matrix.trainer_bin }}" "release-staging/nam-trainer-${{ matrix.platform }}"
          cd target/bundled
          for plugin in *.clap *.vst3; do
            [ -e "$plugin" ] || continue
            ext="${plugin##*.}"
            zip -r "../../release-staging/nam-plugin-${{ matrix.platform }}-${ext}.zip" "$plugin"
          done

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-staging | Out-Null
          Copy-Item "target/release/${{ matrix.trainer_bin }}" "release-staging/nam-trainer-${{ matrix.platform }}.exe"
          Compress-Archive -Path "target/bundled/nam-plugin.clap" -DestinationPath "release-staging/nam-plugin-${{ matrix.platform }}-clap.zip" -Force
          Compress-Archive -Path "target/bundled/nam-plugin.vst3" -DestinationPath "release-staging/nam-plugin-${{ matrix.platform }}-vst3.zip" -Force

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.platform }}
          path: release-staging/

      - name: Upload release measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-callback-${{ matrix.platform }}
          path: profiles/

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --prerelease \
            --generate-notes \
            artifacts/*
