name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  # Override .cargo/config.toml's target-cpu=native, which can crash on CI runners.
  # RUSTFLAGS takes precedence over the repository's build.rustflags instead of
  # merging with them, so target-cpu=native is actually removed.
  RUSTFLAGS: "-C llvm-args=--fp-contract=fast"

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libx11-xcb-dev libgl-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-deps-v1-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --workspace

      - name: Run tests
        run: cargo test --workspace

      - name: Test release A2 render parity
        if: runner.os == 'macOS'
        run: >-
          cargo test --release -p nam-core --lib
          get_dsp::tests::test_regression_wavenet_a2_max

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libx11-xcb-dev libgl-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-deps-v1-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  msrv:
    name: MSRV 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libx11-xcb-dev libgl-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.88"

      - name: Check workspace with the minimum supported Rust version
        run: cargo check --workspace --all-targets

  feature-matrix:
    name: Features (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: portable
            args: --no-default-features
          - name: float-io
            args: --no-default-features --features nam-core/float_io
          - name: faer
            args: --no-default-features --features nam-core/faer
          - name: fast-kernels
            args: --no-default-features --features nam-core/fast-kernels
          - name: float-io-faer
            args: --no-default-features --features nam-core/float_io,nam-core/faer
          - name: float-io-fast-kernels
            args: --no-default-features --features nam-core/float_io,nam-core/fast-kernels
          - name: faer-fast-kernels
            args: --no-default-features --features nam-core/faer,nam-core/fast-kernels
          - name: all
            args: --all-features
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libx11-xcb-dev libgl-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Check feature combination
        run: cargo check --workspace --all-targets ${{ matrix.args }}

      - name: Test numerical regression fixtures
        run: cargo test -p nam-core --lib get_dsp::tests::test_regression_ ${{ matrix.args }}

      - name: Test randomized backend equivalence
        run: cargo test -p nam-core --lib backend_equivalence ${{ matrix.args }}

      - name: Test allocation-free WaveNet callbacks
        run: cargo test -p nam-plugin --lib complete_callback_with_a ${{ matrix.args }}

  fuzz-targets:
    name: Fuzz Target Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libx11-xcb-dev libgl-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # nightly
        with:
          toolchain: nightly-2026-03-28

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.1 --locked

      - name: Execute bounded fuzz campaigns
        run: |
          for target in worker_decode settings_migration artifact_naming manifest_parsing unicode_paths model_json plugin_lifecycle; do
            cargo fuzz run "$target" --fuzz-dir fuzz -- \
              -runs=1000 -max_len=65536 -timeout=10 -rss_limit_mb=4096
          done

  wavenet-address-sanitizer:
    name: WaveNet Address Sanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # nightly
        with:
          toolchain: nightly

      - name: Test WaveNet memory boundaries
        env:
          RUSTFLAGS: -Zsanitizer=address
        run: cargo +nightly test -p nam-core --lib wavenet --target x86_64-unknown-linux-gnu

      - name: Test fast-kernel FFI boundaries
        env:
          RUSTFLAGS: -Zsanitizer=address
          CFLAGS: -fsanitize=address -fno-omit-frame-pointer
        run: >-
          cargo +nightly test -p nam-core --lib fast_kernels::tests
          --features fast-kernels --target x86_64-unknown-linux-gnu

  wavenet-miri:
    name: WaveNet Miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # nightly
        with:
          toolchain: nightly
          components: miri

      - name: Test safe layer and head borrowing
        run: |
          cargo +nightly miri test -p nam-core --lib wavenet::tests::test_upstream_layers_configs_and_head_object_load
          cargo +nightly miri test -p nam-core --lib wavenet::tests::test_top_level_head_loads_and_processes

      - name: Test DSP state and activation memory behavior
        run: |
          cargo +nightly miri test -p nam-core --lib linear::tests
          cargo +nightly miri test -p nam-core --lib activations::tests::test_apply_slice
          cargo +nightly miri test -p nam-core --lib wavenet::tests::test_conv1d_depthwise_multi_tap

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libx11-xcb-dev libgl-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: llvm-tools-preview

      - name: Install coverage runner
        run: cargo install cargo-llvm-cov --version 0.6.16 --locked

      - name: Generate workspace coverage
        run: >-
          cargo llvm-cov --workspace --all-features
          --ignore-filename-regex 'third-party/nih-plug'
          --fail-under-lines 70
          --lcov --output-path lcov.info

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-coverage
          path: lcov.info

  inference-instruction-baseline:
    name: Inference Instructions (${{ matrix.name }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            feature_args: ""
          - name: faer
            feature_args: "--features faer"
          - name: fast-kernels
            feature_args: "--features fast-kernels"
    env:
      IAI_CALLGRIND_VALGRIND_INCLUDE: /usr/local/include
      CARGO_PROFILE_BENCH_DEBUG: true
      CARGO_PROFILE_BENCH_STRIP: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install Callgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          curl --fail --location --silent --show-error \
            --output /tmp/valgrind-3.27.1.tar.bz2 \
            https://sourceware.org/pub/valgrind/valgrind-3.27.1.tar.bz2
          echo "0b113f5c80d34743195b78651c2520901ba630cf  /tmp/valgrind-3.27.1.tar.bz2" | sha1sum --check
          tar -xf /tmp/valgrind-3.27.1.tar.bz2 -C /tmp
          cd /tmp/valgrind-3.27.1
          ./configure --prefix=/usr/local
          make -j2
          sudo make install
          cargo install iai-callgrind-runner --version 0.14.2 --locked

      - name: Measure A1, A2, and Linear inference
        run: >-
          cargo bench -p nam-core --bench inference_callgrind
          --no-default-features ${{ matrix.feature_args }}
          -- --save-summary=json --allow-aslr=yes

      - name: Enforce instruction budget
        run: >-
          python3 scripts/check_instruction_budget.py
          ${{ matrix.name }}
          target/iai
          .github/performance/inference_instructions.json

      - name: Measure native AVX2/FMA A1 inference
        if: matrix.name == 'default'
        run: >-
          cargo bench -p nam-core --bench inference_native_callgrind
          --no-default-features
          -- --save-summary=json --allow-aslr=yes

      - name: Summarize native A1 profile
        if: matrix.name == 'default'
        run: |
          find target/iai -path '*inference_native_callgrind*' \
            -type f -name 'callgrind.*.out' -print0 |
            while IFS= read -r -d '' profile; do
              echo "PROFILE: ${profile}"
              callgrind_annotate --threshold=0.5 --show=Ir "${profile}" |
                sed -n '1,120p'
            done

      - name: Upload instruction profiles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inference-instructions-${{ matrix.name }}
          path: target/iai

  plugin-callback-instruction-budget:
    name: Plugin Callback Instructions
    runs-on: ubuntu-22.04
    env:
      IAI_CALLGRIND_VALGRIND_INCLUDE: /usr/local/include
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux and Callgrind dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev libx11-xcb-dev libgl-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev
          curl --fail --location --silent --show-error \
            --output /tmp/valgrind-3.27.1.tar.bz2 \
            https://sourceware.org/pub/valgrind/valgrind-3.27.1.tar.bz2
          echo "0b113f5c80d34743195b78651c2520901ba630cf  /tmp/valgrind-3.27.1.tar.bz2" | sha1sum --check
          tar -xf /tmp/valgrind-3.27.1.tar.bz2 -C /tmp
          cd /tmp/valgrind-3.27.1
          ./configure --prefix=/usr/local
          make -j2
          sudo make install

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install Callgrind runner
        run: cargo install iai-callgrind-runner --version 0.14.2 --locked

      - name: Measure complete callback and resampling
        run: >-
          cargo bench -p nam-plugin --features benchmark-internals
          --bench callback_callgrind
          -- --save-summary=json --allow-aslr=yes

      - name: Enforce callback instruction budget
        run: >-
          python3 scripts/check_instruction_budget.py
          plugin
          target/iai
          .github/performance/plugin_callback_instructions.json

  dependency-policy:
    name: Dependency Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          command: check advisories bans licenses sources

  trainer-gui:
    name: Trainer GUI Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libx11-xcb-dev libgl-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-trainer-gui-deps-v1-${{ hashFiles('**/Cargo.lock') }}

      - name: Check trainer formatting
        run: cargo fmt --all -- --check

      - name: Test trainer GUI
        run: cargo test -p nam-trainer

      - name: Clippy trainer GUI
        run: cargo clippy -p nam-trainer --all-targets -- -D warnings

      - name: Check trainer Python scripts
        run: python3 -m py_compile nam-trainer/python/detect_environment.py nam-trainer/python/nam_worker.py

      - name: Test CI helper scripts
        run: PYTHONPATH=scripts python3 -m unittest discover -s scripts -p 'test_*.py'

  plugin-release-validation:
    name: Plugin Release Validation
    uses: ./.github/workflows/plugin-release-validation.yml
