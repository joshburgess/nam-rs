[package]
name = "nam-plugin"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["fast-kernels"]
fast-kernels = ["nam-core/fast-kernels"]
benchmark-internals = []

[[bench]]
name = "callback_callgrind"
harness = false
required-features = ["benchmark-internals"]

[[bench]]
name = "callback"
harness = false
required-features = ["benchmark-internals"]

[[bench]]
name = "callback_instructions"
harness = false
required-features = ["benchmark-internals"]

[dependencies]
crossbeam-queue = "0.3"
nam-core = { version = "0.2.0", path = "../nam-core" }
nih_plug = { version = "0.0.0", path = "../third-party/nih-plug" }
nih_plug_egui = { version = "0.0.0", path = "../third-party/nih-plug/nih_plug_egui" }
rfd = "0.15"
rubato = "0.14"

[dev-dependencies]
criterion = "0.5"
proptest = "1"
serde_json = "1"

[target.'cfg(not(target_env = "musl"))'.dev-dependencies]
iai-callgrind = { version = "0.14", features = ["client_requests_defs"] }

[target.'cfg(all(target_os = "linux", not(target_env = "musl")))'.dev-dependencies]
iai-callgrind = { version = "0.14", features = ["client_requests"] }
