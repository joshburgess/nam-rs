[package]
name = "nam-cli"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
faer = ["nam-core/faer"]
fast-kernels = ["nam-core/fast-kernels"]

[dependencies]
nam-core = { version = "0.2.0", path = "../nam-core" }
clap = { version = "4", features = ["derive"] }
hound = "3.5"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
