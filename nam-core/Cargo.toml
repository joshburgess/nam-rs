[package]
name = "nam-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rust DSP inference engine for Neural Amp Modeler"

[lints]
workspace = true

[features]
default = []
float_io = []  # Use f32 instead of f64 for process() I/O (matches C++ DSP_SAMPLE_FLOAT)
faer = []  # Compatibility alias; WaveNet uses its allocation-free matrix backend
fast-kernels = []  # Optimized C inner loops
benchmark-internals = []

[build-dependencies]
cc = { version = "1", optional = false }

[dependencies]
ndarray = "0.16"
nano-gemm = "0.1"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
approx = "0.5"
criterion = "0.5"
hound = "3.5"
iai-callgrind = { version = "0.14", features = ["client_requests_defs"] }
proptest = "1"

[target.'cfg(target_os = "linux")'.dev-dependencies]
iai-callgrind = { version = "0.14", features = ["client_requests"] }

[[bench]]
name = "inference"
harness = false

[[bench]]
name = "inference_callgrind"
harness = false

[[bench]]
name = "inference_native_callgrind"
harness = false

[[bench]]
name = "conv1d_shapes"
harness = false
required-features = ["fast-kernels", "benchmark-internals"]
